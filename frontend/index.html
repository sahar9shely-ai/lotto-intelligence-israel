<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c4d41" />
    <meta
      name="description"
      content="תזרים — מעקב השקעות שותפים, תשלומים חודשיים והצעות למשקיעים חדשים."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700&family=Heebo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>תזרים</title>
    <script>
      /* One-shot cache bust — never loop-reload */
      (function () {
        var V = "tazrim-v5-20260806-stable";
        var LOCK = "tazrim-cache-busting";
        try {
          if (sessionStorage.getItem(LOCK) === "1") {
            sessionStorage.removeItem(LOCK);
            localStorage.setItem("tazrim-cache-bust", V);
            return;
          }
          if (localStorage.getItem("tazrim-cache-bust") === V) return;
          sessionStorage.setItem(LOCK, "1");
          localStorage.setItem("tazrim-cache-bust", V);
          var done = Promise.resolve();
          if (window.caches) {
            done = done.then(function () {
              return caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              });
            });
          }
          if (navigator.serviceWorker) {
            done = done.then(function () {
              return navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              });
            });
          }
          done.finally(function () { location.reload(); });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
